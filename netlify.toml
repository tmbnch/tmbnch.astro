[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Serverless Functions (v2): eine Datei pro Function, Pfad und Zeitplan stehen als
# `export const config` in der Datei. Gemeinsamer Code liegt in netlify/lib/.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `pnpm dev:netlify` startet Astro dahinter und bedient Functions, Redirects und
# Forms unter http://localhost:8888. Variablen kommen aus .env.local.
[dev]
  framework = "#custom"
  command = "pnpm astro dev --port 4330"
  targetPort = 4330
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# www zeigt auf die Hauptdomain.
[[redirects]]
  from = "https://www.timebench.io/*"
  to = "https://timebench.io/:splat"
  status = 301
  force = true
